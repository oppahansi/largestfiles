<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Largest Files</title>
</head>
<body>
    <div id="LargestFilesPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-select">
        <style>
            #LargestFilesPage .lf-summary { opacity: .8; margin: .5em 0 1.5em; }
            #LargestFilesPage .lf-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(18em, 1fr)); gap: 1em; margin-bottom: 2em; }
            #LargestFilesPage .lf-card { background: rgba(127, 127, 127, .1); border-radius: .5em; padding: 1em; }
            #LargestFilesPage .lf-card h3 { margin: 0 0 .5em; }
            #LargestFilesPage .lf-card dl { display: grid; grid-template-columns: auto 1fr; gap: .2em 1em; margin: 0 0 .8em; }
            #LargestFilesPage .lf-card dt { opacity: .7; }
            #LargestFilesPage .lf-card dd { margin: 0; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
            #LargestFilesPage .lf-bar { height: .4em; border-radius: .2em; background: rgba(127, 127, 127, .2); margin-bottom: .8em; overflow: hidden; }
            #LargestFilesPage .lf-bar > span { display: block; height: 100%; background: #00a4dc; }
            #LargestFilesPage details { margin-top: .4em; }
            #LargestFilesPage summary { cursor: pointer; opacity: .85; }
            #LargestFilesPage .lf-mini { width: 100%; font-size: .9em; margin-top: .3em; }
            #LargestFilesPage .lf-mini td:last-child, #LargestFilesPage .lf-mini td:nth-last-child(2) { text-align: right; white-space: nowrap; }
            #LargestFilesPage .lf-controls { display: flex; flex-wrap: wrap; gap: 1em; align-items: flex-end; margin-bottom: 1em; }
            #LargestFilesPage .lf-controls .selectContainer, #LargestFilesPage .lf-controls .inputContainer { margin: 0; min-width: 12em; }
            #LargestFilesPage .lf-table-wrap { overflow-x: auto; }
            #LargestFilesPage table.lf-files { width: 100%; border-collapse: collapse; }
            #LargestFilesPage table.lf-files th, #LargestFilesPage table.lf-files td { text-align: left; padding: .5em .6em; border-bottom: 1px solid rgba(127, 127, 127, .2); vertical-align: top; }
            #LargestFilesPage table.lf-files td.lf-num, #LargestFilesPage table.lf-files th.lf-num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
            #LargestFilesPage .lf-path { font-size: .8em; opacity: .6; word-break: break-all; }
            #LargestFilesPage a { color: inherit; }
        </style>
        <div data-role="content">
            <div class="content-primary">
                <h2>Largest Files</h2>
                <div class="lf-summary" id="lfSummary">Loading…</div>

                <h3>Libraries</h3>
                <div class="lf-cards" id="lfCards"></div>

                <h3>Files by size</h3>
                <div class="lf-controls">
                    <div class="selectContainer">
                        <label class="selectLabel" for="lfLibrary">Library</label>
                        <select is="emby-select" id="lfLibrary" class="emby-select-withcolor emby-select">
                            <option value="">All libraries</option>
                        </select>
                    </div>
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="lfLimit">Show</label>
                        <input id="lfLimit" type="number" is="emby-input" min="1" max="5000" value="100" />
                    </div>
                    <button is="emby-button" type="button" id="lfRefresh" class="raised emby-button"><span>Refresh</span></button>
                </div>
                <div class="lf-table-wrap">
                    <table class="lf-files">
                        <thead>
                            <tr><th class="lf-num">#</th><th>Name</th><th>Library</th><th>Type</th><th class="lf-num">Size</th></tr>
                        </thead>
                        <tbody id="lfFiles"></tbody>
                    </table>
                </div>
            </div>
        </div>
        <script type="text/javascript">
            (function () {
                var page = document.querySelector('#LargestFilesPage');

                function formatBytes(bytes) {
                    var units = ['B', 'KB', 'MB', 'GB', 'TB', 'PB'];
                    var i = 0;
                    while (bytes >= 1024 && i < units.length - 1) {
                        bytes /= 1024;
                        i++;
                    }
                    return bytes.toFixed(i < 3 ? 0 : 2) + ' ' + units[i];
                }

                function esc(value) {
                    var div = document.createElement('div');
                    div.textContent = value == null ? '' : String(value);
                    return div.innerHTML;
                }

                function itemLink(file) {
                    var href = '#/details?id=' + encodeURIComponent(file.ItemId) + '&serverId=' + encodeURIComponent(ApiClient.serverId());
                    return '<a href="' + href + '">' + esc(file.Name) + '</a>';
                }

                function groupTable(groups) {
                    return '<table class="lf-mini">' + groups.map(function (g) {
                        return '<tr><td>' + esc(g.Name) + '</td><td>' + g.FileCount + '</td><td>' + formatBytes(g.TotalSize) + '</td></tr>';
                    }).join('') + '</table>';
                }

                function renderCards(report) {
                    var max = report.Libraries.reduce(function (m, l) { return Math.max(m, l.TotalSize); }, 0) || 1;
                    page.querySelector('#lfCards').innerHTML = report.Libraries.map(function (lib) {
                        var share = report.TotalSize ? (lib.TotalSize / report.TotalSize * 100).toFixed(1) : '0';
                        var html = '<div class="lf-card"><h3>' + esc(lib.Name) + '</h3>'
                            + '<div class="lf-bar"><span style="width:' + (lib.TotalSize / max * 100) + '%"></span></div>'
                            + '<dl>'
                            + '<dt>Total</dt><dd>' + formatBytes(lib.TotalSize) + ' (' + share + '%)</dd>'
                            + '<dt>Files</dt><dd>' + lib.FileCount.toLocaleString() + '</dd>'
                            + '<dt>Average</dt><dd>' + formatBytes(lib.AverageSize) + '</dd>';
                        if (lib.LargestFile) {
                            html += '<dt>Largest</dt><dd title="' + esc(lib.LargestFile.Name) + '">' + itemLink(lib.LargestFile) + '</dd>'
                                + '<dt></dt><dd>' + formatBytes(lib.LargestFile.Size) + '</dd>';
                        }
                        html += '</dl>';
                        if (lib.TopSeries.length) {
                            html += '<details><summary>Largest series</summary>' + groupTable(lib.TopSeries) + '</details>';
                        }
                        if (lib.Extensions.length) {
                            html += '<details><summary>By file type</summary>' + groupTable(lib.Extensions) + '</details>';
                        }
                        return html + '</div>';
                    }).join('');
                }

                function renderFiles(report) {
                    var rows = report.Files.map(function (f, i) {
                        return '<tr><td class="lf-num">' + (i + 1) + '</td>'
                            + '<td>' + itemLink(f) + '<div class="lf-path">' + esc(f.Path) + '</div></td>'
                            + '<td>' + esc(f.Library) + '</td>'
                            + '<td>' + esc(f.Type) + '</td>'
                            + '<td class="lf-num">' + formatBytes(f.Size) + '</td></tr>';
                    });
                    page.querySelector('#lfFiles').innerHTML = rows.join('') || '<tr><td colspan="5">No files found.</td></tr>';
                }

                function renderLibraryOptions(report) {
                    var select = page.querySelector('#lfLibrary');
                    var current = select.value;
                    select.innerHTML = '<option value="">All libraries</option>' + report.Libraries.map(function (lib) {
                        return '<option value="' + esc(lib.Id) + '">' + esc(lib.Name) + '</option>';
                    }).join('');
                    select.value = current;
                }

                function load() {
                    Dashboard.showLoadingMsg();
                    var params = { limit: page.querySelector('#lfLimit').value || 100 };
                    var libraryId = page.querySelector('#lfLibrary').value;
                    if (libraryId) {
                        params.libraryId = libraryId;
                    }

                    ApiClient.getJSON(ApiClient.getUrl('LargestFiles/Report', params)).then(function (report) {
                        page.querySelector('#lfSummary').textContent = report.TotalFiles.toLocaleString() + ' files, '
                            + formatBytes(report.TotalSize) + ' across ' + report.Libraries.length + ' libraries';
                        renderLibraryOptions(report);
                        renderCards(report);
                        renderFiles(report);
                    }).catch(function () {
                        page.querySelector('#lfSummary').textContent = 'Failed to load the report. Check the server log.';
                    }).finally(function () {
                        Dashboard.hideLoadingMsg();
                    });
                }

                page.addEventListener('pageshow', load);
                page.querySelector('#lfRefresh').addEventListener('click', load);
                page.querySelector('#lfLibrary').addEventListener('change', load);
            })();
        </script>
    </div>
</body>
</html>
